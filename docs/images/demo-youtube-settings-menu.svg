<svg xmlns="http://www.w3.org/2000/svg" width="288" height="640" viewBox="0 0 288 640" role="img" aria-labelledby="title desc">
  <title id="title">YouTube volume slider settings menu</title>
  <desc id="desc">Volume Slider Options popover with replace native mode, native spot placement, the new icon style, a 5 percent adjustment step, and slider behavior controls.</desc>
  <defs>
    <filter id="shadow" x="-16%" y="-8%" width="132%" height="118%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.48"/>
    </filter>
    <style>
      .title{fill:#fff;font:500 14px/20px Arial,Helvetica,sans-serif}
      .section{fill:rgba(255,255,255,.55);font:500 11px/14px Arial,Helvetica,sans-serif;letter-spacing:.04em}
      .radio{fill:rgba(255,255,255,.82);font:400 14px/16px Arial,Helvetica,sans-serif}
      .radio-on{fill:#fff;font:400 14px/16px Arial,Helvetica,sans-serif}
      .row{fill:#fff;font:400 14px/18px Arial,Helvetica,sans-serif}
      .value{fill:rgba(255,255,255,.65);font:400 12px/18px Arial,Helvetica,sans-serif}
      .reset{fill:rgba(255,255,255,.9);font:400 14px/16px Arial,Helvetica,sans-serif}
    </style>
  </defs>

  <g filter="url(#shadow)">
    <rect x=".5" y=".5" width="287" height="639" rx="8" fill="rgba(18,18,18,0.97)" stroke="rgba(255,255,255,0.12)"/>
  </g>
  <line x1="0" y1="44.5" x2="288" y2="44.5" stroke="rgba(255,255,255,0.1)"/>
  <text class="title" x="16" y="28">Volume Slider Options</text>

  <text class="section" x="16" y="67">MODE</text>
  <rect x="16" y="82" width="124" height="34" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
  <rect x="148" y="82" width="124" height="34" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
  <text class="radio" x="78" y="103" text-anchor="middle">On</text>
  <text class="radio" x="210" y="103" text-anchor="middle">Off</text>
  <rect x="16" y="124" width="256" height="34" rx="6" fill="#bb3333"/>
  <text class="radio-on" x="144" y="145" text-anchor="middle">Replace native</text>

  <line x1="0" y1="167" x2="288" y2="167" stroke="rgba(255,255,255,0.08)"/>
  <text class="section" x="16" y="191">POSITION WHEN REPLACING NATIVE</text>
  <rect x="16" y="206" width="124" height="34" rx="6" fill="#bb3333"/>
  <rect x="148" y="206" width="124" height="34" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
  <text class="radio-on" x="78" y="227" text-anchor="middle">Native spot</text>
  <text class="radio" x="210" y="227" text-anchor="middle">Custom spot</text>

  <line x1="0" y1="249" x2="288" y2="249" stroke="rgba(255,255,255,0.08)"/>
  <text class="section" x="16" y="273">ICON STYLE</text>
  <rect x="16" y="288" width="124" height="34" rx="6" fill="#bb3333"/>
  <rect x="148" y="288" width="124" height="34" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
  <text class="radio-on" x="78" y="309" text-anchor="middle">New</text>
  <text class="radio" x="210" y="309" text-anchor="middle">Classic</text>

  <line x1="0" y1="331" x2="288" y2="331" stroke="rgba(255,255,255,0.08)"/>
  <text class="section" x="16" y="355">ADJUSTMENT STEP</text>
  <rect x="16" y="370" width="58" height="34" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
  <rect x="82" y="370" width="58" height="34" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
  <rect x="148" y="370" width="58" height="34" rx="6" fill="#bb3333"/>
  <rect x="214" y="370" width="58" height="34" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
  <text class="radio" x="45" y="391" text-anchor="middle">1%</text>
  <text class="radio" x="111" y="391" text-anchor="middle">2%</text>
  <text class="radio-on" x="177" y="391" text-anchor="middle">5%</text>
  <text class="radio" x="243" y="391" text-anchor="middle">10%</text>

  <line x1="0" y1="413" x2="288" y2="413" stroke="rgba(255,255,255,0.08)"/>
  <text class="section" x="16" y="437">SLIDER BEHAVIOR</text>
  <text class="row" x="16" y="471">Always expanded</text>
  <rect x="254.75" y="458.75" width="16.5" height="16.5" rx="2.5" fill="transparent" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  <text class="row" x="16" y="503">Show on video</text>
  <rect x="254.75" y="490.75" width="16.5" height="16.5" rx="2.5" fill="transparent" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>

  <line x1="0" y1="525" x2="288" y2="525" stroke="rgba(255,255,255,0.08)"/>
  <text class="section" x="16" y="549">BAR THICKNESS</text>
  <text class="row" x="16" y="579">Thickness</text>
  <text class="value" x="94" y="579">75%</text>
  <line x1="16" y1="605" x2="208" y2="605" stroke="rgba(255,255,255,0.22)" stroke-width="4" stroke-linecap="round"/>
  <line x1="16" y1="605" x2="160" y2="605" stroke="rgba(255,255,255,0.92)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="160" cy="605" r="7" fill="#fff"/>
  <rect x="220" y="591" width="52" height="28" rx="6" fill="rgba(255,255,255,0.12)"/>
  <text class="reset" x="246" y="609" text-anchor="middle">Reset</text>
</svg>
