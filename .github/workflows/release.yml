name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag to backfill
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify tag and archive
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          mode="current"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="historical"
            git rev-parse --verify --quiet "refs/tags/$tag^{commit}"
          fi
          node scripts/release-preflight.mjs "$tag" "$mode" > release-preflight.json
          version="${tag#v}"
          if [ "$mode" = current ]; then node scripts/verify-release.mjs "$version"; fi
          mkdir release-stage
          cp "archive/releases/$version/YouTube Volume Slider $version/YouTube Volume Slider $version.user.js" "release-stage/YouTube.Volume.Slider.$version.user.js"
          cp "archive/releases/$version/Twitch Volume Slider $version/Twitch Volume Slider $version.user.js" "release-stage/Twitch.Volume.Slider.$version.user.js"
          cp "release-notes/$version.md" release-stage/notes.md
          cp release-preflight.json release-stage/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: release-stage
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: release-stage
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          test "$(find release-stage -maxdepth 1 -type f | wc -l)" -eq 4
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          youtube="release-stage/YouTube.Volume.Slider.$version.user.js"
          twitch="release-stage/Twitch.Volume.Slider.$version.user.js"
          test "$(sha256sum "$youtube" | cut -d' ' -f1)" = "$(jq -r .expectedHashes.youtube release-stage/manifest.json)"
          test "$(sha256sum "$twitch" | cut -d' ' -f1)" = "$(jq -r .expectedHashes.twitch release-stage/manifest.json)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Volume Sliders $version" --notes-file release-stage/notes.md
          else
            gh release create "$tag" --verify-tag --title "Volume Sliders $version" --notes-file release-stage/notes.md
          fi
          gh release upload "$tag" "$youtube" "$twitch" --clobber
          test "$(gh release view "$tag" --json assets --jq ".assets[] | select(.name == \"YouTube.Volume.Slider.$version.user.js\") | .digest")" = "sha256:$(jq -r .expectedHashes.youtube release-stage/manifest.json)"
          test "$(gh release view "$tag" --json assets --jq ".assets[] | select(.name == \"Twitch.Volume.Slider.$version.user.js\") | .digest")" = "sha256:$(jq -r .expectedHashes.twitch release-stage/manifest.json)"
